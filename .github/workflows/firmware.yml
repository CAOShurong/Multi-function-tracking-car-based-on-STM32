name: Firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the Ubuntu 24.04 Arm bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi
          arm-none-eabi-gcc --version

      - name: Test the artifact validator
        run: python3 -m unittest discover -s tools -p 'test_*.py'

      - name: Test every Bluetooth command byte pair
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -Ifirmware/Core/Inc \
            tools/test_control_protocol.c \
            firmware/Core/Src/control_protocol.c \
            -o "$RUNNER_TEMP/control_protocol_test"
          "$RUNNER_TEMP/control_protocol_test"

      - name: Configure the release build
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake

      - name: Compile, link, and generate flash images
        run: cmake --build build --verbose

      - name: Validate firmware shape and record hashes
        run: |
          python3 tools/validate_firmware.py build/car-1.bin
          test -s build/car-1.elf
          test -s build/car-1.hex
          test -s build/car-1.map
          arm-none-eabi-readelf -h build/car-1.elf | grep 'Machine:.*ARM'
          sha256sum build/car-1.elf build/car-1.hex build/car-1.bin build/car-1.map

      - name: Upload reviewable firmware artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stm32f103-robot-car-firmware
          path: |
            build/car-1.elf
            build/car-1.hex
            build/car-1.bin
            build/car-1.map
          if-no-files-found: error
          retention-days: 14
